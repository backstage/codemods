name: Sync codemod README

on:
  workflow_dispatch:

concurrency:
  group: sync-codemod-readme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Generate and propose README
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache path
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Generate README
        run: yarn readme

      # GITHUB_TOKEN-created PRs do not trigger pull_request CI. Validate here instead.
      - name: Validate generated README and repository
        run: |
          cp README.md "$RUNNER_TEMP/generated-readme.md"
          yarn readme
          cmp README.md "$RUNNER_TEMP/generated-readme.md"
          yarn format:check
          yarn lint
          yarn test
          bash scripts/test-check-changed.sh
          bash scripts/test-sync-readme-pr.sh

      - name: Create or update review PR (no-op if README is current)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sync-readme-pr.sh
