# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

nodes:
  - id: apply-transforms
    name: 'Rename OpenAPI validation command'
    type: automatic
    steps:
      - name: 'Update package scripts'
        js-ast-grep:
          js_file: scripts/package-json-codemod.ts
          language: 'json'
          base_path: '.'
          include:
            - '**/package.json'
          exclude:
            - '**/node_modules/**'
      - name: 'Update GitHub Actions run commands'
        js-ast-grep:
          js_file: scripts/ci-yaml-codemod.ts
          language: 'yaml'
          base_path: '.'
          include:
            - '**/.github/workflows/*.yml'
            - '**/.github/workflows/*.yaml'
          exclude:
            - '**/node_modules/**'
      - name: 'Update shell scripts'
        env:
          CODEMOD_SCRIPT: 'scripts/shell-codemod.mjs'
          CODEMOD_URL_MODULE: 'node:url'
        run: 'node -e import(require(process.env.CODEMOD_URL_MODULE).pathToFileURL(process.env.CODEMOD_PATH+String.fromCharCode(47)+process.env.CODEMOD_SCRIPT)) ${{ state.targetDirEncoded }}'
