name: 'backstage-repo-tools repo schema openapi verify'
on: push
jobs:
  validate:
    steps:
      - name: 'Verify schema'
        run: 'CI=1 yarn backstage-repo-tools repo schema openapi validate --strict'
      - run: |
          backstage-repo-tools repo schema openapi validate --flag
          echo done
      - run: backstage-repo-tools repo schema openapi validate && echo ok
      - run: "npx backstage-repo-tools repo schema openapi validate --strict"
