# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

nodes:
  - id: apply-transforms
    name: 'Move Connections backend imports and re-exports'
    type: automatic
    steps:
      - name: 'Split backend-only Connections symbols from common exports'
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: 'tsx'
          base_path: '.'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
