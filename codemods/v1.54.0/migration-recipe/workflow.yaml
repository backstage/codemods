# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    aiFixup:
      type: boolean
      default: false
      description: 'Optional AI fixup for the extension config schema step; not validated by this recipe.'

nodes:
  - id: apply-recipe
    name: 'Run every Backstage 1.54.0 codemod in order'
    type: automatic
    steps:
      # --- BREAKING: Connections backend-only imports moved to @backstage/connections-backend
      - name: 'Split backend-only Connections symbols from common exports'
        js-ast-grep:
          js_file: scripts/move-connections-backend-imports.ts
          language: 'tsx'
          base_path: '.'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: built-in Connections URL lookups moved into query objects
      - name: 'Move built-in URL lookups into query objects'
        js-ast-grep:
          js_file: scripts/migrate-connections-query.ts
          language: 'tsx'
          semantic_analysis: file
          base_path: '.'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: RootConnectionAuth renamed to ConfiguredConnectionAuth
      - name: 'Rename imports, re-exports and bound type references'
        js-ast-grep:
          js_file: scripts/rename-root-connection-auth.ts
          language: 'tsx'
          semantic_analysis: file
          base_path: '.'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
            - '**/coverage/**'

      # --- BREAKING: extension config.schema factories must return Standard Schema values
      - name: 'Index direct package-local Zod v4 dependencies'
        js-ast-grep:
          js_file: scripts/migrate-extension-config-schema-index.ts
          language: 'json'
          base_path: '.'
          include:
            - '**/package.json'
          exclude:
            - '**/node_modules/**'

      - name: 'Lift safe Zod v4 factories to configSchema'
        js-ast-grep:
          js_file: scripts/migrate-extension-config-schema.ts
          language: 'tsx'
          base_path: '.'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: repo schema openapi verify renamed to validate
      - name: 'Update package scripts'
        js-ast-grep:
          js_file: scripts/rename-openapi-validate-command-package-json.ts
          language: 'json'
          base_path: '.'
          include:
            - '**/package.json'
          exclude:
            - '**/node_modules/**'

      - name: 'Update GitHub Actions run commands'
        js-ast-grep:
          js_file: scripts/rename-openapi-validate-command-ci-yaml.ts
          language: 'yaml'
          base_path: '.'
          include:
            - '**/.github/workflows/*.yml'
            - '**/.github/workflows/*.yaml'
          exclude:
            - '**/node_modules/**'

      - name: 'Update shell scripts'
        env:
          CODEMOD_SCRIPT: 'scripts/rename-openapi-validate-command-shell.mjs'
          CODEMOD_URL_MODULE: 'node:url'
        # The -e payload must be quoted: an unquoted parenthesized expression
        # is a syntax error under sh (Linux) even though cmd accepts it.
        run: 'node -e "import(require(process.env.CODEMOD_URL_MODULE).pathToFileURL(process.env.CODEMOD_PATH+String.fromCharCode(47)+process.env.CODEMOD_SCRIPT))" ${{ state.targetDirEncoded }}'

  - id: ai-fixup
    name: 'Review unresolved schema factories'
    type: automatic
    depends_on: [apply-recipe]
    steps:
      - name: 'Resolve only provably equivalent residual factories'
        if: params.aiFixup == true
        ai:
          prompt: |
            Inspect only residual config.schema and TODO(backstage-codemod) in extension
            options passed to createExtension, createExtensionBlueprint, makeWithOverrides,
            and override from @backstage/frontend-plugin-api. The AST step already lifts
            safe inline Zod v4 factories and flags unsupported cases. Preserve validation,
            defaults, optionality, comments, and config factory usage. Confirm the target
            package directly declares compatible Zod v4 before using zod/v4. Resolve
            referenced factories only when the Standard Schema value is clearly equivalent;
            leave uncertainty marked for human review. Do not modify unrelated .schema or
            dependency versions. Type-check changed packages and review the diff.
          max_steps: 30
