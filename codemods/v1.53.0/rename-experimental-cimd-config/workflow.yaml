# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

nodes:
  - id: apply-transforms
    name: 'Rename experimental CIMD auth configuration key'
    type: automatic
    steps:
      - name: 'Rename auth.experimentalClientIdMetadataDocuments'
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: 'yaml'
          include:
            - '**/app-config*.yaml'
            - '**/app-config*.yml'
          exclude:
            - '**/node_modules/**'
