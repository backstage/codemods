# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    aiFixup:
      type: boolean
      default: false
      description: 'Optional AI fixup for migration edge cases; not validated by this recipe.'

nodes:
  - id: apply-recipe
    name: Run every Backstage 1.45.0 codemod in order
    type: automatic
    steps:
      # --- BREAKING: @backstage/ui BUI component migrations (v0.9.0)
      #     Avatar, Checkbox, and Collapsible all migrated from Base UI to
      #     custom/React Aria implementations.

      - name: 'Migrate Avatar: remove render prop, rename size="large" to size="x-large"'
        js-ast-grep:
          js_file: scripts/migrate-avatar-to-custom.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate Checkbox props and label to children for React Aria'
        js-ast-grep:
          js_file: scripts/migrate-checkbox-to-react-aria.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate Collapsible compound component to Accordion'
        js-ast-grep:
          js_file: scripts/migrate-collapsible-to-accordion.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
  - id: ai-fixup
    name: 'Optional AI fixup for migration edge cases'
    type: automatic
    depends_on: [apply-recipe]
    steps:
      - name: 'Fix remaining Checkbox migration edge cases'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that migrated the Checkbox component from Base UI
            to React Aria in @backstage/ui v0.9.0 (Backstage 1.45.0).

            The AST codemod already handled:
            - Prop renames: checked→isSelected, defaultChecked→defaultSelected,
              disabled→isDisabled, required→isRequired
            - Simple label="string" and label={variable} → children conversion
            - Self-closing to open/close tag conversion when adding children
            - Boolean shorthand props (e.g. required → isRequired)

            Your job is ONLY to fix complex patterns that the AST codemod could not
            handle mechanically. Be precise and conservative.
          prompt: |
            Search the codebase for remaining Checkbox migration issues:

            ## 1. Complex label expressions
            Find Checkbox components where the label prop contains JSX, ternaries,
            or function calls that may not have been converted to children correctly.

            ## 2. Spread props
            Find {...props} patterns on Checkbox from @backstage/ui where checked,
            label, or other renamed props may be passed dynamically.

            ## 3. CSS class references
            Find references to bui-CheckboxLabel CSS class and add appropriate
            TODO comments.

            ## 4. Wrapper components
            Find wrapper components that forward Checkbox props and may still use
            the old prop names.

            After making changes, verify the files are syntactically valid.
          max_steps: 25
      - name: 'Fix remaining Collapsible migration edge cases'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that migrated Collapsible compound components
            to Accordion in @backstage/ui v0.9.0 (Backstage 1.45.0).

            The AST codemod already handled:
            - Import replacement: Collapsible → Accordion, AccordionTrigger, AccordionPanel
            - Collapsible.Root → Accordion
            - Collapsible.Panel → AccordionPanel
            - Simple Collapsible.Trigger render patterns → AccordionTrigger with children

            Your job is ONLY to fix complex patterns that the AST codemod could not
            handle mechanically. Be precise and conservative.
          prompt: |
            Search the codebase for remaining Collapsible migration issues:

            ## 1. Complex render functions
            Find Collapsible.Trigger components where the render prop contains
            conditional logic, multiple elements, or complex patterns that may not
            have been converted correctly to AccordionTrigger children.

            ## 2. Controlled open/close state
            Find Collapsible usages with controlled open/close state management
            and verify the migration to Accordion handles state correctly.

            ## 3. Nested collapsibles
            Find nested Collapsible patterns and verify correct migration.

            ## 4. Custom styling
            Find CSS targeting Collapsible-specific class names and update for
            Accordion equivalents.

            After making changes, verify the files are syntactically valid.
          max_steps: 25
