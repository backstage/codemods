# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    jestVersion:
      type: string
      default: '30'
      description: 'Jest major version to add: "30" (default, recommended) or "29"'

nodes:
  - id: apply-recipe
    name: Run every Backstage 1.46.0 codemod in order
    type: automatic
    steps:
      # --- CLI / tooling: add jest as explicit peer dependency
      - name: 'Add jest peer dependencies to root package.json (@backstage/cli >= 0.35.0)'
        js-ast-grep:
          js_file: scripts/add-jest-peer-dependency.ts
          language: 'json'
          include:
            - 'package.json'
          exclude:
            - '**/node_modules/**'
            - 'packages/**/package.json'
            - 'plugins/**/package.json'
      # --- Backend config: migrate Valkey cache options
      - name: 'Migrate Valkey cache configuration to new native options (@backstage/backend-defaults >= 0.14.0)'
        js-ast-grep:
          js_file: scripts/migrate-valkey-config.ts
          language: 'yaml'
          include:
            - '**/app-config.yaml'
            - '**/app-config.*.yaml'
            - '**/app-config.yml'
            - '**/app-config.*.yml'
          exclude:
            - '**/node_modules/**'
