# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'
params:
  schema:
    aiFixup:
      type: boolean
      default: false
      description: 'Optional AI fixup for edge cases the local AST transforms cannot handle mechanically.'
nodes:
  - id: apply-recipe
    name: 'Run every Backstage 1.51.0 codemod in order'
    type: automatic
    steps:
      - name: 'Migrate NavItemBlueprint title/icon into matching PageBlueprint params'
        js-ast-grep:
          js_file: scripts/migrate-nav-item-to-page.ts
          language: 'tsx'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Call PortableSchema.schema() as a method instead of property access'
        js-ast-grep:
          js_file: scripts/portable-schema-method-call.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate PolicyQueryUser off removed token/identity fields'
        js-ast-grep:
          js_file: scripts/migrate-policy-query-user.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename removed .bui-Header root class and HeaderDefinition.classNames.root'
        js-ast-grep:
          js_file: scripts/rename-header-main-class.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename .bui-Header to .bui-HeaderContent in CSS/SCSS files'
        js-ast-grep:
          js_file: scripts/rename-header-main-class-css.ts
          language: 'css'
          include:
            - '**/*.css'
            - '**/*.scss'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate renderInTestApp nav-item tests to renderTestApp'
        js-ast-grep:
          js_file: scripts/render-test-app-nav-migration.ts
          language: 'tsx'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename deprecated loading prop to isPending on @backstage/ui components'
        js-ast-grep:
          js_file: scripts/loading-to-is-pending.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename data-loading to data-ispending in CSS/SCSS files'
        js-ast-grep:
          js_file: scripts/loading-to-is-pending-css.ts
          language: 'css'
          include:
            - '**/*.css'
            - '**/*.scss'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename EXPERIMENTAL_formDecorators to formDecorators on scaffolder templates'
        js-ast-grep:
          js_file: scripts/experimental-form-decorators-to-stable-yaml.ts
          language: 'yaml'
          include:
            - '**/*.yaml'
            - '**/*.yml'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename EXPERIMENTAL_formDecorators to formDecorators in TS object literals'
        js-ast-grep:
          js_file: scripts/experimental-form-decorators-to-stable.ts
          language: 'tsx'
          semantic_analysis: file
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate catalog immediate stitching mode to deferred in app-config'
        js-ast-grep:
          js_file: scripts/remove-immediate-stitching-mode.ts
          language: 'yaml'
          include:
            - '**/app-config.yaml'
            - '**/app-config.*.yaml'
            - '**/app-config.yml'
            - '**/app-config.*.yml'
          exclude:
            - '**/node_modules/**'
  - id: ai-fixup
    name: 'AI fixup for edge cases'
    type: automatic
    depends_on:
      - apply-recipe
    steps:
      - name: 'Fix remaining NavItemBlueprint migration edge cases'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over\nfrom an AST-based codemod that migrated NavItemBlueprint to PageBlueprint\nin Backstage 1.51.0.\n\nThe AST codemod already handled the mechanical parts:\n- Removed NavItemBlueprint.make where statically paired with PageBlueprint\n  (same routeRef)\n- Copied title / icon into PageBlueprint.params or makeWithOverrides factory\n- Wrapped MUI icon identifiers as <Icon fontSize=\"inherit\" />\n- Removed nav item variables from extensions arrays\n- Removed unused NavItemBlueprint imports\n- Left TODO(backstage-codemod) for unpaired or dynamic routeRef values\n\nYour job is to find and fix remaining issues that the AST codemod could\nnot handle mechanically. Be precise and conservative \xE2\u20AC\u201D only change what\nis necessary.\n"
          prompt: |
            Search the codebase for remaining NavItemBlueprint migration issues:

            ## 1. Unpaired NavItemBlueprint or legacy nav-item extensions
            Find NavItemBlueprint.make calls, NavItemBlueprint imports, or legacy
            nav-item extensions still registered in createFrontendPlugin /
            createFrontendModule extension arrays.

            ## 2. Wrong page pairing
            When multiple PageBlueprint extensions share similar routeRef patterns,
            verify title and icon were merged into the correct page extension.

            ## 3. Icon migration
            Convert Material UI icon components used only for navigation to
            @remixicon/react IconElement JSX where appropriate. PageBlueprint.icon
            must be IconElement (JSX), not IconComponent.

            ## 4. Extension registration cleanup
            Ensure createFrontendModule / createFrontendPlugin extensions arrays
            no longer export removed NavItemBlueprint extensions.

            ## 5. Valid TSX
            Verify icon values are JSX elements and files compile as valid TSX.

            After making changes, verify the files are syntactically valid TypeScript/TSX.
          max_steps: 50
      - name: 'Fix remaining PortableSchema.schema property access patterns'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that rewrites PortableSchema.schema property access
            to method calls in Backstage 1.51.0.

            The deprecated property form of PortableSchema.schema has been removed from
            @backstage/frontend-plugin-api. Callers must use schema() instead of reading
            schema properties directly.

            The AST codemod already handled:
            - X.schema.<jsonSchemaProp> -> X.schema().<jsonSchemaProp> for known JSON Schema properties
            - Optional chaining: schema?.type -> schema()?.type
            - Skipping unrelated .schema members when no PortableSchema context is present
            - Skipping expressions where schema is already invoked as schema()

            Your job is ONLY to fix remaining or incorrect patterns the AST codemod could
            not handle mechanically. Be precise and conservative.
          prompt: "Search the codebase for remaining PortableSchema.schema issues:\n\n1. Remaining .schema.type / .schema.properties without () on PortableSchema values\n2. Assignments like `const s = portable.schema` (value, not call) \xE2\u20AC\u201D migrate to schema() or add TODO\n3. False positives on non-PortableSchema .schema members \xE2\u20AC\u201D revert incorrect transforms\n4. Type annotations referencing the old property form\n\nAfter making changes, verify the files are syntactically valid TypeScript.\n"
          max_steps: 25
      - name: 'Fix remaining edge cases that require contextual understanding'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over\nfrom an AST-based codemod that migrates PolicyQueryUser usage in\n@backstage/plugin-permission-node for Backstage 1.51.0.\n\nThe AST codemod already handled the mechanical parts:\n- Removed token, expiresInSeconds, and identity from destructuring patterns\n- Renamed identity to info in destructuring and property access\n- Removed removed fields from PolicyQueryUser object literals in tests/mocks\n- Added TODO comments where token was passed to downstream APIs\n\nYour job is to find and fix remaining issues that the AST codemod could\nnot handle mechanically. Be precise and conservative \xE2\u20AC\u201D only change what\nis necessary. Do not remove required info or credentials fields.\n"
          prompt:
            "Search the codebase for remaining PolicyQueryUser migration issues:\n\n## 1. Remaining token usage\nFind any remaining user.token or .token access on policy query objects,\ndestructured token bindings, or PolicyQueryUser mocks. Replace token\nvalidation with credentials + coreServices.auth patterns where the backend\nmodule context makes that possible.\n\n## 2. Auth service migration\nWhere coreServices.auth is available in the permission policy backend\nmodule, replace manual token validation or token forwarding with\ncredentials-based auth using the AuthService API documented at\nhttps://backstage.io/docs/backend-system/core-services/auth\n\n## 3. Test and mock cleanup\nFind permission policy tests and mocks still constructing PolicyQueryUser\nwith token, expiresInSeconds, or identity fields and remove them.\n\n## 4. Preserve required fields\nDo not remove info or credentials from PolicyQueryUser usage \xE2\u20AC\u201D both\nremain required.\n\nAfter making changes, verify\
            \ the files are syntactically valid TypeScript.\n"
          max_steps: 40
      - name: 'Fix remaining edge cases that require contextual understanding'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that renamed .bui-Header to .bui-HeaderContent
            and classNames.root to classNames.content in Backstage 1.51.0 (BUI v0.15.0).

            The root Header DOM element was removed and split into section classes
            (headerTop, headerBottom, content, titleStack, tags, etc.), so child/descendant
            selectors targeting `.bui-Header > ...` may need to be restructured. The AST
            codemod added TODO comments for these cases.

            Your job is to find and fix the remaining issues that the AST codemod could not
            handle mechanically. Be precise and conservative.
          prompt: "Search the codebase for remaining migration issues and fix them:\n\n## 1. Review TODO comments\nFind all `/* TODO(backstage-codemod): Header root class removed \xE2\u20AC\u201D review selector intent */`\ncomments and assess whether the surrounding selector needs restructuring.\n\n## 2. Verify selector correctness\nFor selectors that used `.bui-Header > .child`, verify that the child selector\nstill applies correctly now that the root wrapper element was removed. Target the\nappropriate section class (content, headerTop, headerBottom) when needed.\n\n## 3. Fix styled-components / CSS modules\nCheck for broken specificity or incorrect renames in styled-components, Emotion,\nand CSS modules. Revert any incorrect renames of section classes like\nbui-HeaderTop or bui-HeaderContent.\n\nAfter making changes, verify the files are syntactically valid.\n"
          max_steps: 30
      - name: 'Fix remaining edge cases that require contextual understanding'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over\nfrom an AST-based codemod that migrated renderInTestApp nav-item tests to\nrenderTestApp in Backstage 1.51.0.\n\nThe AST codemod already handled the mechanical parts:\n- Replaced renderInTestApp with renderTestApp when features includes nav-item\n- Removed nav-item-only features from options\n- Left TODO(backstage-codemod) on sidebar/link assertions\n\nYour job is to find and fix remaining issues that the AST codemod could\nnot handle mechanically. Be precise and conservative \xE2\u20AC\u201D only change what\nis necessary.\n"
          prompt: "Search the codebase for remaining renderInTestApp nav-item migration issues:\n\n## 1. Missed renderInTestApp usages with nav features\nFind tests still using renderInTestApp with features arrays that include\nnav-item extensions, NavItemBlueprint-backed features, or legacy nav\nfeature factories. Migrate them to renderTestApp.\n\n## 2. Sidebar and nav assertions\nRewrite assertions (getByRole('link', \xE2\u20AC\xA6), sidebar selectors, nav labels)\nso they work against renderTestApp's real app shell instead of the old\nstub sidebar from renderInTestApp.\n\n## 3. Preserve non-nav options\nKeep mountedRoutes, APIs, and other non-nav options from the original\nrenderInTestApp call when they are still needed.\n\n## 4. Skip unaffected tests\nDo not change tests that only use renderInTestApp without nav features\nand without sidebar/nav assertions.\n\nAfter making changes, verify the files are syntactically valid TypeScript/TSX.\n"
          max_steps: 50
      - name: 'Fix remaining loading prop and data-loading CSS edge cases'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that renamed the deprecated `loading` prop to
            `isPending` on Alert, Button, ButtonIcon, Table, and TableRoot from
            `@backstage/ui` in v0.15.0 (Backstage 1.51.0), and renamed CSS
            `[data-loading]` selectors to `[data-ispending]`.

            The AST codemod already handled:
            - Named imports: `loading` -> `isPending` on in-scope BUI components
            - Namespace imports: `UI.Button loading={...}` -> `UI.Button isPending={...}`
            - CSS attribute selectors: `[data-loading]` -> `[data-ispending]`
            - Skipped non-BUI `loading` props (MUI, custom components)

            Your job is ONLY to fix complex patterns that the AST codemod could not
            handle mechanically. Be precise and conservative.
          prompt: |
            Search the codebase for remaining migration issues and fix them:

            ## 1. Spread props on BUI components
            Find `{...props}` patterns on Alert, Button, ButtonIcon, Table, or TableRoot
            from `@backstage/ui` where `loading` may be passed dynamically. Rename to
            `isPending` where safe, or add a TODO comment when static renaming is impossible.

            ## 2. Aliased and namespace imports
            Verify `UI.Button`, aliased imports, and re-exports still using `loading`
            on BUI components were migrated to `isPending`.

            ## 3. CSS pending-state selectors
            Find custom CSS still targeting only `data-loading` for BUI pending styles
            and update to `data-ispending`.

            ## 4. Do not rename unrelated APIs
            Do NOT rename MUI `loading` props, React Query `isLoading`, or other
            non-BUI loading props.

            After making changes, verify the files are syntactically valid.
          max_steps: 20
