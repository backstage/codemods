# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    aiFixup:
      type: boolean
      default: false
      description: 'Run optional AI fixups after all local AST transforms for edge cases requiring contextual review.'

nodes:
  - id: apply-recipe
    name: Run every Backstage 1.50.0 codemod in order
    type: automatic
    steps:
      # --- BREAKING ALPHA: normalize catalog-node imports first so later
      #     codemods that touch CatalogApi / CatalogService see a consistent
      #     import surface (stable package, not /alpha).
      - name: 'Replace deprecated @backstage/plugin-catalog-node/alpha exports with stable equivalents'
        js-ast-grep:
          js_file: 'scripts/catalog-node-alpha-to-stable.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Add required entityRef field to Location object literals (@backstage/catalog-client)'
        js-ast-grep:
          js_file: 'scripts/add-entity-ref-to-location.ts'
          language: 'tsx'
          semantic_analysis: 'workspace'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Add required updateLocation method to CatalogApi / CatalogService implementations'
        js-ast-grep:
          js_file: 'scripts/add-update-location-method.ts'
          language: 'tsx'
          semantic_analysis: 'workspace'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename SignalService exports to SignalsService in @backstage/plugin-signals-node'
        js-ast-grep:
          js_file: 'scripts/migrate-signals-service.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Migrate PermissionedRoute to Route + RequirePermission (@backstage/plugin-permission-react)'
        js-ast-grep:
          js_file: 'scripts/migrate-permissioned-route.ts'
          language: 'tsx'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Replace createSchemaFromZod / config.schema with configSchema'
        js-ast-grep:
          js_file: 'scripts/replace-create-schema-from-zod.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename HeaderTab to HeaderNavTabItem and remove matchStrategy in @backstage/ui'
        js-ast-grep:
          js_file: 'scripts/header-tab-to-nav-tab-item.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename .bui-PluginHeaderToolbarWrapper to .bui-PluginHeaderToolbar and related classNames'
        js-ast-grep:
          js_file: 'scripts/rename-plugin-header-toolbar.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Rename PluginHeaderToolbarWrapper to PluginHeaderToolbar in CSS/SCSS files'
        js-ast-grep:
          js_file: 'scripts/rename-plugin-header-toolbar-css.ts'
          language: 'css'
          include:
            - '**/*.css'
            - '**/*.scss'
          exclude:
            - '**/node_modules/**'
      - name: 'Replace deprecated DialogApi .show() and .showModal() with .open()'
        js-ast-grep:
          js_file: 'scripts/dialog-api-show-to-open.ts'
          language: 'tsx'
          semantic_analysis: 'workspace'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Replace humanizeEntityRef / humanizeEntity with the Catalog Presentation API'
        js-ast-grep:
          js_file: 'scripts/humanize-entity-ref-to-presentation.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
      - name: 'Remove deprecated bootstrapEnvProxyAgents() call and import from @backstage/cli-common'
        js-ast-grep:
          js_file: 'scripts/remove-bootstrap-env-proxy.ts'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'
  - id: 'ai-fixup'
    name: 'Review unresolved migration edge cases'
    type: 'automatic'
    depends_on:
      - 'apply-recipe'
    steps:
      - name: 'catalog-node-alpha-to-stable: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that migrated @backstage/plugin-catalog-node/alpha

            exports to their stable equivalents in Backstage 1.50.0.


            The AST codemod already handled the mechanical parts:

            - Stabilized exports (catalogServiceRef, Catalog*ExtensionPoint, etc.) were moved

            \  from @backstage/plugin-catalog-node/alpha to @backstage/plugin-catalog-node.

            - catalogPermissionExtensionPoint references were replaced with

            \  coreServices.permissionsRegistry from @backstage/backend-plugin-api.

            - Superseded type imports (CatalogPermissionRuleInput, CatalogPermissionExtensionPoint)

            \  were removed.


            Your job is to find and fix the remaining issues that the AST codemod could not

            handle mechanically. Be precise and conservative — only change what is necessary.\n"
          prompt: "Search the codebase for remaining migration issues and fix them. Address each

            category below in order:


            ## 1. Namespace imports

            Find any `import * as <alias> from '@backstage/plugin-catalog-node/alpha'` statements.

            For each:

            - Identify which properties of the namespace alias are used (e.g., `Alpha.catalogServiceRef`).

            - Replace namespace property accesses with direct named imports from the correct package:

            \  - Stabilized exports (catalogServiceRef, catalogProcessingExtensionPoint, etc.)

            \    → import from '@backstage/plugin-catalog-node'

            \  - catalogPermissionExtensionPoint → replace with coreServices.permissionsRegistry

            \    from '@backstage/backend-plugin-api'

            \  - Non-migratable exports (CatalogModelExtensionPoint, catalogModelExtensionPoint,

            \    catalogEntityPermissionResourceRef) → keep importing from alpha

            - Remove the namespace import if all usages have been replaced, or keep it for

            \  any remaining non-migratable usages.


            ## 2. Dep variable renaming (superseded permission migration)

            Find any `deps: { <key>: coreServices.permissionsRegistry }` patterns where the

            dep key name still references \"catalog\" (e.g., `catalog`, `catalogPerms`, `cat`).

            Rename the dep key to `permissions` and update the corresponding destructured

            parameter in the `async init({ ... })` function and all usages of that parameter

            within the init function body. Only rename if the current name is clearly

            catalog-oriented and misleading.


            ## 3. Dangling superseded type references

            Find any remaining references to `CatalogPermissionRuleInput` or

            `CatalogPermissionExtensionPoint` that are no longer imported. For each:

            - If used as a type annotation, check if there is an equivalent type available

            \  from @backstage/backend-plugin-api (e.g., PermissionRuleInput). If so, add

            \  the import and replace the type. If not, add a TODO comment noting manual

            \  migration is needed.


            ## 4. Shorthand properties

            Find any shorthand property usage like `{ catalogPermissionExtensionPoint }` that

            was not transformed by the AST codemod. Replace with the expanded form using the

            new API: `{ permissionsRegistry: coreServices.permissionsRegistry }`.


            ## 5. Removed re-exports

            Find any files where a re-export of catalogPermissionExtensionPoint was removed

            (the line may be gone or there may be an empty export). If the re-export was

            providing the symbol to downstream consumers, add a comment explaining the

            breaking change and what consumers should use instead.


            After making changes, verify the files are syntactically valid TypeScript.\n"
          max_steps: 50
      - name: 'add-entity-ref-to-location: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are refining the output of an

            AST-based codemod that added the required `entityRef` field to `Location`

            object literals from `@backstage/catalog-client` in Backstage 1.50.0.


            The AST codemod already handled all mechanical parts:

            - Location objects with explicit type annotations (`: Location`, `satisfies Location`,

            \  `as Location`) had `entityRef: 'location:default/example'` added with a TODO comment.

            - Objects using spread from another Location were skipped (they inherit the field).

            - Objects already containing `entityRef` were skipped.

            - Variables returned from functions with a Location return type were traced via

            \  semantic analysis and had `entityRef` added.

            - Mock implementations (`jest.fn<() => Location>().mockImplementation(...)`) were

            \  detected and had `entityRef` added to their returned objects.

            - Test assertions (`toEqual`, `toMatchObject`) on Location-typed variables were

            \  detected and had `entityRef` added to the expected objects.


            Your job is to replace placeholder `entityRef` values with contextually appropriate

            ones. Be precise and conservative — only change what is necessary.\n"
          prompt: "Search the codebase for Location object literals that have the placeholder

            `entityRef: 'location:default/example'` with a TODO comment added by the codemod.


            ## Replace placeholder entityRef values

            Where possible, replace the placeholder `'location:default/example'` with a more

            contextually appropriate value based on the `target` URL in the same object. The

            format is `location:default/generated-<description>`. Keep the TODO comment.


            For example:

            - `target: 'https://github.com/org/repo/blob/main/catalog-info.yaml'`

            \  → `entityRef: 'location:default/generated-org-repo-catalog-info'`

            - `target: 'https://example.com/mock.yaml'`

            \  → `entityRef: 'location:default/generated-mock'`


            After making changes, verify the files are syntactically valid TypeScript.\n"
          max_steps: 20
      - name: 'add-update-location-method: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: 'You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that added the required `updateLocation` method

            to CatalogApi and CatalogService implementations in Backstage 1.50.0.


            The AST codemod already handled the following mechanically:

            - Classes with `implements CatalogApi/CatalogService` got a throwing stub method

            - Mock objects typed as jest.Mocked<CatalogApi> or vi.Mocked<CatalogApi> got updateLocation: jest/vi.fn()

            - Variables with `: CatalogApi` type annotation and object literal values

            - `satisfies CatalogApi` and `as CatalogApi` expressions with object literals

            - Factory functions with explicit CatalogApi/CatalogService return type

            - Generic call expressions like `createMock<CatalogApi>({...})`


            Your job is to find and fix the remaining cases that cannot be detected

            by static AST analysis. Be precise and conservative.

            '
          prompt: "Search the codebase for remaining CatalogApi or CatalogService implementations

            that are missing the `updateLocation` method and add it.


            Look for only these patterns that the AST codemod cannot handle:

            1. Pure structural duck-typing — objects that satisfy the CatalogApi shape

            \   but have NO type annotation, NO `satisfies`, NO `as`, and NO generic

            \   type argument referencing CatalogApi anywhere

            2. Proxy or wrapper patterns — classes/objects that delegate to a CatalogApi

            \   instance and need to forward the new `updateLocation` call


            Do NOT touch any code that already has `updateLocation`.

            After making changes, verify the files are syntactically valid TypeScript.\n"
          max_steps: 50
      - name: 'migrate-permissioned-route: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that migrated PermissionedRoute to Route +

            RequirePermission in Backstage 1.50.0.


            The AST codemod already handled the mechanical parts:

            - Replaced <PermissionedRoute> with <Route> + <RequirePermission> wrapper

            - Moved path and caseSensitive props to the outer <Route>

            - Moved permission and resourceRef props to <RequirePermission>

            - Renamed errorComponent to errorPage

            - Preserved nested route children on the outer <Route>

            - Updated imports: removed PermissionedRoute, added RequirePermission

            \  and Route (from react-router-dom)

            - Detected already-migrated patterns where element already wraps

            \  RequirePermission with matching permission/resourceRef


            Your job is to find and fix remaining issues that the AST codemod could

            not handle mechanically. Be precise and conservative — only change what

            is necessary.\n"
          prompt: 'Search the codebase for remaining PermissionedRoute migration issues:


            ## 1. Missed PermissionedRoute usages

            Find any remaining references to PermissionedRoute in imports, JSX, type

            annotations, or comments. The AST codemod only transforms direct JSX

            usages — re-exports, type references, and dynamic rendering patterns

            (e.g., variable-based component selection) may have been missed.


            ## 2. Dynamic element props

            Find any migrated <Route> + <RequirePermission> patterns where the

            original element prop contained a conditional expression (ternary,

            logical AND, function call). Verify the wrapping is correct — the

            RequirePermission should wrap the entire conditional, not just one branch.


            ## 3. Type annotation cleanup

            Find type annotations or generic parameters that reference

            PermissionedRoute (e.g., ComponentProps<typeof PermissionedRoute>) and

            update them to reference the new pattern.


            After making changes, verify the files are syntactically valid TypeScript/TSX.

            '
          max_steps: 50
      - name: 'replace-create-schema-from-zod: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that replaced createSchemaFromZod and config.schema

            with the new configSchema property in Backstage 1.50.0.


            The AST codemod already handled the mechanical parts:

            - Removed createSchemaFromZod imports from @backstage/frontend-plugin-api

            - Replaced config.schema with configSchema in createExtension/createExtensionBlueprint

            - Replaced config.schema with configSchema in .override()/.make() calls

            - Updated all zod imports from 'zod' to 'zod/v4'

            - Unwrapped createSchemaFromZod(z => z.object({...})) to inline configSchema

            - Converted callback patterns { field: z => z.type() } to { field: z.type() }

            - Flagged remaining type annotations referencing createSchemaFromZod with TODO comments


            Your job is to find and fix remaining issues that the AST codemod could not

            handle mechanically. Be precise and conservative.

            "
          prompt: 'Search the codebase for remaining createSchemaFromZod calls that the AST

            codemod could not transform, and fix them.


            These are complex patterns involving:

            - Variable references (schema defined in a separate variable)

            - Spread operators inside the callback

            - Conditional logic or ternary expressions inside the callback

            - Dynamic property keys or computed values

            - Multi-statement callback bodies


            For each remaining call, inline the schema into configSchema following the

            same pattern as the AST codemod. After making changes, verify the files are

            syntactically valid TypeScript.

            '
          max_steps: 30
      - name: 'header-tab-to-nav-tab-item: Fix complex matchStrategy patterns the AST codemod cannot handle'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: 'You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that renamed HeaderTab to HeaderNavTabItem and

            removed the matchStrategy property in @backstage/ui v0.14.0 (Backstage 1.50.0).


            The AST codemod already handled:

            - Named imports: `import { HeaderTab }` -> `import { HeaderNavTabItem }`

            - Namespace imports: `UI.HeaderTab` -> `UI.HeaderNavTabItem`

            - Type annotations, type assertions (`as HeaderTab`), and generic parameters

            - Simple `matchStrategy` property removal from object literals


            Your job is ONLY to fix complex matchStrategy patterns that the AST codemod

            could not handle mechanically. Be precise and conservative.

            '
          prompt: "Search the codebase for remaining `matchStrategy` properties on tab objects

            that the AST codemod missed. These are cases involving:


            - Computed property names (e.g., `[strategyKey]: 'prefix'`)

            - Dynamic property assignment (e.g., `tab.matchStrategy = 'prefix'`)

            - Spread patterns that inject matchStrategy indirectly

            - Deeply nested or conditionally assigned matchStrategy values


            Remove any remaining matchStrategy properties or assignments you find.

            After making changes, verify the files are syntactically valid TypeScript.

            "
          max_steps: 30
      - name: 'rename-plugin-header-toolbar: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: 'You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that renamed .bui-PluginHeaderToolbarWrapper to

            .bui-PluginHeaderToolbar and classNames.toolbarWrapper to classNames.toolbar

            in Backstage 1.50.0 (BUI v0.14.0).


            The wrapper DOM element was removed from PluginHeader, so child/descendant

            selectors targeting `.bui-PluginHeaderToolbarWrapper > ...` may need to be

            restructured. The AST codemod added TODO comments for these cases.


            Your job is to find and fix the remaining issues that the AST codemod could not

            handle mechanically. Be precise and conservative.

            '
          prompt: 'Search the codebase for remaining migration issues and fix them:


            ## 1. Review TODO comments

            Find all `/* TODO(backstage-codemod): wrapper element was removed — review child/descendant selectors */`

            comments and assess whether the surrounding selector needs restructuring.


            ## 2. Verify selector correctness

            For selectors that used `.bui-PluginHeaderToolbarWrapper > .child`, verify

            that the child selector still applies correctly now that the wrapper element

            is removed. The toolbar children are now direct children of PluginHeader.


            After making changes, verify the files are syntactically valid.

            '
          max_steps: 30
      - name: 'dialog-api-show-to-open: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: "You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that replaced deprecated DialogApi .show() and

            .showModal() calls with .open() in Backstage 1.50.0.


            The AST codemod already handled the mechanical parts:

            - Renamed .show() and .showModal() to .open()

            - Added TODO comments about behavioral differences

            - Detected dismissal checks on .show() return values (=== undefined,

            \  == null, truthiness checks, nullish coalescing) and added specific

            \  TODO comments on those patterns


            Your job is to find and fix remaining issues that the AST codemod could not

            handle mechanically. Be precise and conservative.\n"
          prompt: "Search the codebase for remaining DialogApi migration issues and fix them:


            ## 1. Dialog chrome migration

            Find any .open() calls (formerly .show() or .showModal()) where the content

            component does not include its own dialog wrapper (e.g., MUI Dialog, Modal).

            Add TODO comments noting that the component needs to provide its own dialog

            chrome (backdrop, surface, focus trap).


            ## 2. Backdrop click handling

            Find any code that relied on .show()'s built-in backdrop-click-to-close

            behavior. Add TODO comments explaining that this behavior must now be

            implemented manually in the dialog component.


            After making changes, verify the files are syntactically valid TypeScript.

            "
          max_steps: 50
      - name: 'humanize-entity-ref-to-presentation: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: 'You are a Backstage migration expert. You are fixing edge cases left over

            from an AST-based codemod that migrated humanizeEntityRef/humanizeEntity

            to the Catalog Presentation API in Backstage 1.50.0.


            The AST codemod already handled the mechanical parts:

            - Named imports: humanizeEntityRef / humanizeEntity (including aliases)

            - Namespace imports: CatalogReact.humanizeEntityRef(...) etc.

            - JSX expressions → <EntityDisplayName entityRef={ref} />

            - React component bodies → useEntityPresentation(ref).primaryTitle

            - Non-React utilities → entityPresentationSnapshot(ref).primaryTitle

            - humanizeEntity(entity, fallback) → same replacements

            - String-context detection (template literals, concatenation) → hook/snapshot

            - defaultKind/defaultNamespace options mapping

            - Import and re-export updates


            Your job is to find and fix files where the AST codemod may have chosen

            the wrong replacement. Be precise and conservative — only change what is

            necessary.

            '
          prompt: "Search the codebase for files where the codemod may have incorrectly chosen

            the replacement API based on context. Specifically look for:


            - `useEntityPresentation` used in a non-React utility file (should be

            \  `entityPresentationSnapshot`)

            - `entityPresentationSnapshot` used inside a React component where the

            \  hook `useEntityPresentation` would be more appropriate

            - `<EntityDisplayName>` used where a string value is actually needed

            \  (e.g., passed to a function expecting `string`, used in comparisons)


            After making changes, verify the files are syntactically valid TypeScript.\n"
          max_steps: 50
      - name: 'remove-bootstrap-env-proxy: Fix remaining edge cases that require contextual understanding'
        if: 'params.aiFixup == true'
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: 'You are a Backstage migration expert. You are scanning for environment

            configuration that needs updating after the removal of deprecated

            bootstrapEnvProxyAgents() from @backstage/cli-common in Backstage 1.50.0.


            The AST codemod already handled all TypeScript/JavaScript changes:

            - Removed named imports (`import { bootstrapEnvProxyAgents }`)

            - Removed namespace import calls (`alias.bootstrapEnvProxyAgents()`)

            - Removed dynamic import patterns (`await import(...)` destructuring)

            - Removed re-exports of bootstrapEnvProxyAgents

            - Added TODO comments about setting NODE_USE_ENV_PROXY=1


            Your job is to find environment configuration files that set proxy

            variables and suggest adding NODE_USE_ENV_PROXY=1 alongside them.

            Be precise and conservative -- only change what is necessary.

            '
          prompt: 'Search the codebase for environment configuration files that need updating:


            ## Environment configuration

            Search for any .env files, Dockerfiles, docker-compose files, or shell scripts

            that set HTTP_PROXY or HTTPS_PROXY and add NODE_USE_ENV_PROXY=1 alongside them.


            For each file found:

            - If it''s a .env file, add `NODE_USE_ENV_PROXY=1` as a new line near the proxy vars

            - If it''s a Dockerfile, add `ENV NODE_USE_ENV_PROXY=1` near existing proxy ENV lines

            - If it''s a docker-compose file, add `NODE_USE_ENV_PROXY: "1"` to the environment section

            - If it''s a shell script, add `export NODE_USE_ENV_PROXY=1` near proxy exports

            '
          max_steps: 15
