# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    aiFixup:
      type: boolean
      default: false
      description: 'Optional AI fixup for createPublicSignInApp edge cases the AST transform cannot handle mechanically.'

nodes:
  - id: apply-recipe
    name: 'Run every Backstage 1.49.0 codemod in order'
    type: automatic
    steps:
      # --- BUI CSS: rename HeaderPage classes first since later codemods
      #     may reference the new class names.
      - name: 'Rename BUI HeaderPage CSS classes to Header'
        js-ast-grep:
          js_file: scripts/rename-bui-header-css-classes.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
          exclude:
            - '**/node_modules/**'

      - name: 'Rename bui-HeaderPage* to bui-Header* in CSS/SCSS files'
        js-ast-grep:
          js_file: scripts/rename-bui-header-css-classes-css.ts
          language: 'css'
          include:
            - '**/*.css'
            - '**/*.scss'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: Catalog plugin card props removed
      - name: 'Remove deprecated variant and gridSizes props from catalog card components'
        js-ast-grep:
          js_file: scripts/remove-catalog-card-variant-props.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: Gerrit integration function renames
      - name: 'Rename deprecated Gerrit Gitiles functions in @backstage/integration'
        js-ast-grep:
          js_file: scripts/migrate-gerrit-gitiles-functions.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: Frontend plugin API type rename
      - name: 'Rename deprecated AnyExtensionDataRef to ExtensionDataRef'
        js-ast-grep:
          js_file: scripts/remove-any-extension-data-ref.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: createPublicSignInApp removed
      - name: 'Replace createPublicSignInApp with createApp + appModulePublicSignIn'
        js-ast-grep:
          js_file: scripts/remove-create-public-sign-in-app.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

      # --- BREAKING: createApp option removed
      - name: 'Remove deprecated allowUnknownExtensionConfig from createApp()'
        js-ast-grep:
          js_file: scripts/remove-allow-unknown-extension-config.ts
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.ts'
            - '**/*.tsx'
          exclude:
            - '**/node_modules/**'

  - id: ai-fixup
    name: 'AI fixup for edge cases'
    type: automatic
    depends_on: ['apply-recipe']
    steps:
      - name: 'Fix remaining edge cases that require contextual understanding'
        if: params.aiFixup == true
        ai:
          model: 'claude-sonnet-4-6'
          system_prompt: |
            You are a Backstage migration expert. You are fixing edge cases left over
            from an AST-based codemod that replaced createPublicSignInApp with createApp
            combined with appModulePublicSignIn from @backstage/plugin-app/alpha.

            Your job is to find and fix any remaining issues the AST codemod could not
            handle mechanically. Be precise and conservative.
          prompt: |
            Search the codebase for remaining migration issues:

            1. Find any remaining references to createPublicSignInApp
            2. Ensure appModulePublicSignIn is properly imported from @backstage/plugin-app/alpha
            3. Verify the modules array is correctly constructed
            4. Add @backstage/plugin-app as a dependency if not present

            After making changes, verify the files are syntactically valid.
          max_steps: 15
